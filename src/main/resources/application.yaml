spring:
  application:
    name: order-management

  datasource:
    url: jdbc:mysql://localhost:3060/orderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKeyWithAtLeast32Characters}
      expiration: 3600000

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG